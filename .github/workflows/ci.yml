# Runs on GitHub Actions and, unchanged, on Forgejo or Gitea Actions.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: srms
          POSTGRES_USER: srms
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U srms" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      FIELD_ENCRYPTION_KEY: ci-only-not-a-secret
      DB_HOST: localhost
      DB_NAME: srms
      DB_USER: srms
      DB_PASSWORD: ci_only_not_a_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements.txt
      - run: ruff check api
      - run: python api/manage.py check
      - run: python api/manage.py makemigrations --check --dry-run
      - run: python api/manage.py spectacular --validate --file /dev/null
      - run: cd api && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_only/' .env
      - run: docker compose -f compose.yml -f deploy/compose.prod.yml config --quiet
      - run: docker build -t gsa-srms-api:ci ./api
