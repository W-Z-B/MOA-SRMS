# Development stack. Production overrides live in deploy/compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-srms}
      POSTGRES_USER: ${DB_USER:-srms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: ${TZ:-America/Guyana}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-srms} -d ${DB_NAME:-srms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
      - files:/srv/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./api
    env_file: .env
    command: python manage.py procrastinate worker
    volumes:
      - ./api:/app
      - files:/srv/files
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules

  caddy:
    image: caddy:2-alpine
    ports:
      - "8081:80"
      - "8444:443"
    environment:
      DOMAIN: ${DOMAIN:-srms.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  files:
  web_modules:
  caddy_data:
  caddy_config:
